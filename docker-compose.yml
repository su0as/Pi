name: pi

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pi
      POSTGRES_PASSWORD: pi_dev_password
      POSTGRES_DB: pi_dev
    ports:
      - "5432:5432"
    volumes:
      - pi_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi -d pi_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  # S3-compatible object storage for local dev (stands in for Cloudflare R2 — see
  # docs/adr/0004-local-object-storage.md for why this is SeaweedFS and not MinIO).
  object-storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.port=8333
      - -ip.bind=0.0.0.0
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI
      - "8888:8888" # filer UI
    volumes:
      - pi_object_storage_data:/data
      - ./scripts/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pi_postgres_data:
  pi_object_storage_data:
