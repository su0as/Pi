name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pi
          POSTGRES_PASSWORD: pi_dev_password
          POSTGRES_DB: pi_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi -d pi_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # apps/api's auth tests send real email through this (docker-compose.yml's local
      # equivalent) and verify delivery via Mailpit's own HTTP API — not a live SMTP relay, no
      # secret needed.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q -O - http://localhost:8025/api/v1/info || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pi:pi_dev_password@localhost:5432/pi_dev
      NODE_ENV: test
      # Not a real secret — CI never talks to a real OAuth provider or signs anything anyone
      # relies on; this only needs to satisfy loadApiEnv's schema and better-auth's own
      # minimum-length check.
      BETTER_AUTH_SECRET: ci-test-secret-00000000000000000000000000000000

    steps:
      - uses: actions/checkout@v4

      - name: Enable pgvector / pg_trgm / unaccent extensions
        run: |
          PGPASSWORD=pi_dev_password psql -h localhost -U pi -d pi_dev -f scripts/init-db.sql

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check for uncommitted migration drift
        run: |
          pnpm --filter @repo/db db:generate
          git diff --exit-code -- packages/db/migrations || \
            (echo "::error::Schema and committed migrations are out of sync — run 'pnpm --filter @repo/db db:generate' and commit the result." && exit 1)

      # Applied before Test: apps/api's integration tests (idempotency, rate limiting) hit real
      # tables, not just a live connection.
      - name: Apply migrations
        run: pnpm --filter @repo/db db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check for uncommitted api-client drift
        run: |
          pnpm --filter @repo/api-client generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts || \
            (echo "::error::The OpenAPI spec and committed api-client types are out of sync — run 'pnpm api-client:generate' and commit the result." && exit 1)

      - name: Run seed
        run: pnpm --filter @repo/db db:seed
